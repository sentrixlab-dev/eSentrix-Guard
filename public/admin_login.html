<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Admin Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050508;
            --bg-card: #0d0d13;
            --border-color: #1b1b24;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --danger: #ef4444;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Subtle radial background glow */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(59, 130, 246, 0.03);
            backdrop-filter: blur(12px);
            transition: var(--transition);
        }

        .login-box:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 40px rgba(59, 130, 246, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 2.25rem;
        }

        .logo-icon-wrap {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            box-shadow: 0 0 20px var(--primary-glow);
            color: #fff;
        }

        .logo h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .logo p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.15);
        }

        input:focus + i {
            color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
            background: linear-gradient(135deg, #2563eb, #1e40af);
        }

        button:active {
            transform: translateY(0);
        }

        .error-msg {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 0.75rem;
            border-radius: 0.75rem;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 1.25rem;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .footer-link a {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-decoration: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-link a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <div class="logo-icon-wrap">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Admin Console</h2>
                <p>System Administrator Portal</p>
            </div>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" required autocomplete="username" placeholder="Enter admin username">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" required autocomplete="current-password" placeholder="Enter admin password">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
                <button type="submit">Verify Identity</button>
                <div class="error-msg" id="error-msg">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span id="err-text">Authentication failed!</span>
                </div>
            </form>
        </div>
        <div class="footer-link">
            <a href="/login"><i class="fa-solid fa-arrow-left-long"></i> Back to Customer Login</a>
        </div>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const errorBox = document.getElementById('error-msg');
            const errorText = document.getElementById('err-text');
            
            errorBox.style.display = 'none';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/admin';
                } else {
                    errorText.innerText = data.error || 'Invalid administrator credentials.';
                    errorBox.style.display = 'inline-flex';
                }
            } catch (err) {
                errorText.innerText = 'Unable to establish connection to auth server.';
                errorBox.style.display = 'inline-flex';
            }
        });
    </script>
</body>
</html>
