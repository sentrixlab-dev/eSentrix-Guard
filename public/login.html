<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - Ecom Centrix Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-[#f3f0fa] min-h-screen text-slate-800 flex items-center justify-center p-4 font-['Hind_Siliguri']">

    <div class="w-full max-w-[420px] bg-white rounded-3xl p-7 md:p-8 shadow-xl shadow-purple-950/5 border border-purple-100/70 space-y-6">
        
        <!-- Logo & Title -->
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-purple-100/80 text-purple-700 flex items-center justify-center text-xl shadow-xs mx-auto">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <h1 class="text-lg font-black text-purple-900 font-['Outfit'] tracking-tight">Ecom Centrix Cart</h1>
            <p class="text-xs text-slate-500 font-medium">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4 text-xs font-semibold">
            <div>
                <label class="block text-slate-700 mb-1.5 font-bold uppercase text-[10px] tracking-wider">ইউজারনেম</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="username" required placeholder="আপনার ইউজারনেম লিখুন" 
                           class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-600/30 font-semibold text-slate-800">
                </div>
            </div>

            <div>
                <label class="block text-slate-700 mb-1.5 font-bold uppercase text-[10px] tracking-wider">পাসওয়ার্ড</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                    <input type="password" id="password" required placeholder="••••••••" 
                           class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-600/30 font-semibold text-slate-800">
                </div>
            </div>

            <div id="login-error" class="hidden p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs text-center font-medium"></div>

            <button type="submit" id="login-btn" class="w-full py-3 bg-purple-700 hover:bg-purple-800 active:scale-[0.98] text-white rounded-xl font-bold shadow-xs transition flex items-center justify-center gap-2">
                <span>লগইন করুন</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="pt-2 text-center text-[11px] text-slate-400 border-t border-purple-50">
            <span>কুরিয়ার ফ্রড ভেরিফিকেশন প্ল্যাটফর্ম</span>
        </div>

    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errBox = document.getElementById('login-error');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i> <span>যাচাই হচ্ছে...</span>`;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                }).then(r => r.json());

                if (res.success && res.user) {
                    // Always direct to the User Front-end SPA
                    window.location.href = '/';
                } else {
                    errBox.innerText = res.error || 'ভুল ইউজারনেম বা পাসওয়ার্ড!';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.innerText = 'সার্ভার সংযোগে ত্রুটি হয়েছে।';
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>লগইন করুন</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
            }
        }
    </script>
</body>
</html>
